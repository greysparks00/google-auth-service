[project]
name = "googleauth"
version = "0.1.0"
description = "Shared Google OAuth service for Junction"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.115",
	"uvicorn>=0.30",
	"google-auth>=2.35",
	"google-auth-oauthlib>=1.2",
	"python-dotenv>=1.0"
]

[dependency-groups]
dev = [
	"pytest>=8.0",
	"httpx>=0.27"
]